# Production Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false
server.port=8080

# AWS Runtime Configuration
aws.region=us-east-1

# CORS Configuration (set this in environment-specific deployment config)
app.cors.allowed-origins=https://d9wsu3rsp7svw.cloudfront.net

# HikariCP Connection Pool (Production)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA Performance
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=false

# File Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Logging
logging.level.root=WARN
logging.level.com.bgv.application=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Country to Geo Region Mapping Configuration
# Format: COUNTRY:GEOREGION,COUNTRY:GEOREGION
# This mapping can be updated after deployment without code changes or restart
# Geo Regions: USA_AND_CANADA (North America), LATAM (Latin America), EUROPE, APAC (Asia Pacific)
bgv.country.georegion.mapping=USA:USA_AND_CANADA,CANADA:USA_AND_CANADA,MEXICO:USA_AND_CANADA,INDIA:APAC,POLAND:EUROPE,NETHERLANDS:EUROPE,UNITED_KINGDOM:EUROPE,COSTA_RICA:LATAM,BRAZIL:LATAM,COLOMBIA:LATAM,BOLIVIA:LATAM,ARGENTINA:LATAM,ECUADOR:LATAM,UAE:APAC,MALAYSIA:APAC,JAPAN:APAC,SINGAPORE:APAC,AUSTRALIA:APAC
