spring.application.name=bgv-service
server.port=8080

# AWS Configuration
aws.region=us-east-1
# Local DynamoDB can use dummy keys; in cloud deployments leave these empty and use IAM role credentials
aws.accessKeyId=placeholder
aws.secretKey=placeholder

# CORS Configuration (comma-separated)
# Set this to your frontend domain(s), e.g. https://app.example.com,https://www.example.com
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# DynamoDB Configuration
# For local development, use DynamoDB Local (download from AWS) or LocalStack
# DynamoDB Local: http://localhost:8000
# LocalStack: http://localhost:4566
# Leave blank or comment out for AWS Lambda runtime (will use default AWS endpoint)
dynamodb.endpoint=

# Tables will be created automatically on startup if they don't exist
# In Lambda, these are overridden by environment variables from CDK
dynamodb.table.bgvRequests=LTM-mne-paramount-BgvRequests
dynamodb.table.bgvRequestHistory=LTM-mne-paramount-BgvRequestHistory
dynamodb.table.bgvExcelUploadRecords=LTM-mne-paramount-BgvExcelUploadRecords
dynamodb.table.bgvExcelUploadCells=LTM-mne-paramount-BgvExcelUploadCells

# OpenSearch Configuration
# Set opensearch.enabled=true to enable OpenSearch indexing for advanced search capabilities
# When disabled, the application will use DynamoDB scans for all queries
opensearch.enabled=false
opensearch.host=localhost
opensearch.port=9200
opensearch.scheme=https
opensearch.username=placeholder
opensearch.password=placeholder

# Upload limits (Excel import)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# SharePoint Configuration for Express Request Evidence Upload
# To enable automatic upload to SharePoint, set sharepoint.enabled=true and configure credentials
# Get these values from Azure AD App Registration:
#   1. Create an App Registration in Azure Portal (portal.azure.com)
#   2. Grant permissions: Sites.ReadWrite.All, Files.ReadWrite.All
#   3. Create a client secret
#   4. Get Tenant ID, Client ID, and Client Secret
sharepoint.enabled=false
sharepoint.tenant.id=placeholder
sharepoint.client.id=placeholder
sharepoint.client.secret=placeholder
sharepoint.site.id=placeholder
sharepoint.drive.id=placeholder
sharepoint.folder.path=/EXPRESS_REQ_BGV_TEAM

# Country to Geo Region Mapping Configuration
# Format: COUNTRY:GEOREGION,COUNTRY:GEOREGION
# This mapping can be updated after deployment without code changes
# Geo Regions: USA_AND_CANADA (North America), LATAM (Latin America), EUROPE, APAC (Asia Pacific)
bgv.country.georegion.mapping=USA:USA_AND_CANADA,CANADA:USA_AND_CANADA,MEXICO:USA_AND_CANADA,INDIA:APAC,POLAND:EUROPE,NETHERLANDS:EUROPE,UNITED_KINGDOM:EUROPE,COSTA_RICA:LATAM,BRAZIL:LATAM,COLOMBIA:LATAM,BOLIVIA:LATAM,ARGENTINA:LATAM,ECUADOR:LATAM,UAE:APAC,MALAYSIA:APAC,JAPAN:APAC,SINGAPORE:APAC,AUSTRALIA:APAC

# Jackson Configuration for proper JSON serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
