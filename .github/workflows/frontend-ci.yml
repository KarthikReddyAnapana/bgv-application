name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Paramount_Project/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Paramount_Project/frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: Paramount_Project/frontend/package-lock.json

    - name: Install dependencies
      working-directory: Paramount_Project/frontend
      run: npm ci

    - name: Build frontend
      working-directory: Paramount_Project/frontend
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: Paramount_Project/frontend/dist
        retention-days: 7
