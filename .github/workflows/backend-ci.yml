name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Paramount_Project/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Paramount_Project/backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      working-directory: Paramount_Project/backend
      run: mvn clean install -DskipTests

    - name: Run tests
      working-directory: Paramount_Project/backend
      run: mvn test

    - name: Package Lambda artifact
      working-directory: Paramount_Project/backend
      run: mvn package -DskipTests

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-lambda-jar
        path: Paramount_Project/backend/target/*.jar
        retention-days: 7
