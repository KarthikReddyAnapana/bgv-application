name: CDK Diff on PR

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Paramount_Project/infrastructure/cdk/**'
      - '.github/workflows/cdk-diff.yml'

jobs:
  cdk-diff:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: Paramount_Project/infrastructure/cdk/package-lock.json

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build backend Lambda JAR
      working-directory: Paramount_Project/backend
      run: mvn -DskipTests package

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Install CDK dependencies
      working-directory: Paramount_Project/infrastructure/cdk
      run: npm ci

    - name: Build CDK
      working-directory: Paramount_Project/infrastructure/cdk
      run: npm run build

    - name: Run CDK Diff
      id: cdk-diff
      working-directory: Paramount_Project/infrastructure/cdk
      run: |
        echo "## CDK Diff Results" > diff.txt
        echo "" >> diff.txt
        echo "### Dev Stack" >> diff.txt
        echo '```' >> diff.txt
        npx cdk diff BgvServerlessDevStack >> diff.txt || true
        echo '```' >> diff.txt
        
        cat diff.txt

    - name: Comment PR with diff
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          const diff = fs.readFileSync('Paramount_Project/infrastructure/cdk/diff.txt', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: diff
          });
