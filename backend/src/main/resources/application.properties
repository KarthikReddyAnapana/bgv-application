spring.application.name=bgv-service
server.port=8080

# H2 file-based database (PostgreSQL-compatible mode)
# No AUTO_SERVER — it stores a remote TCP address in the lock file and breaks after VPN/network changes
spring.datasource.url=jdbc:h2:file:./data/bgverificationdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;FILE_LOCK=SOCKET
spring.flyway.connect-retries=3
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175

# JWT (override in environment for production)
app.jwt.secret=${JWT_SECRET:ChangeThisSecretKeyForPortfolioDevelopmentOnlyMustBe256BitsLong!!}
app.jwt.expiration-ms=86400000

bgv.country.georegion.mapping=USA:USA_AND_CANADA,CANADA:USA_AND_CANADA,MEXICO:USA_AND_CANADA,INDIA:APAC,POLAND:EUROPE,NETHERLANDS:EUROPE,UNITED_KINGDOM:EUROPE,COSTA_RICA:LATAM,BRAZIL:LATAM,COLOMBIA:LATAM,BOLIVIA:LATAM,ARGENTINA:LATAM,ECUADOR:LATAM,UAE:APAC,MALAYSIA:APAC,JAPAN:APAC,SINGAPORE:APAC,AUSTRALIA:APAC

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
